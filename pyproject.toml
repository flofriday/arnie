[project]
name = "arnie"
version = "0.1.0"
description = "Benchmark tool for openVADL compiler performance"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "tomli-w>=1.2.0",
]

[project.scripts]
arnie = "arnie.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arnie"]

[tool.hatch.build.targets.sdist]
only-include = ["arnie", "arnie.py", "tests", "README.md", "pyproject.toml", "uv.lock", ".python-version"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "PLW1510"]
